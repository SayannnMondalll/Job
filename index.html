<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown </title> 
<link rel="preconnect" href="https://fonts.googleapis.com"> 
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#090a14;
    --bg-deep2:#11132a;
    --violet:#9d8cff;
    --violet-soft:#6f62c9;
    --cyan:#5eead4;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.14);
    --text:#f2f1f8;
    --text-dim:#9c9bb5;
    --text-faint:#5f5f78;
    --glow-violet:rgba(157,140,255,0.45);
    --glow-cyan:rgba(94,234,212,0.30);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{ height:100%; }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:var(--bg-deep);
    color:var(--text);
    font-family:'DM Sans', sans-serif;
    overflow:hidden;
    position:relative;
  }

  /* ===== Aurora orbs backdrop ===== */
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
    z-index:0;
  }
  .orb--violet{
    width:520px; height:520px;
    background:radial-gradient(circle, var(--violet) 0%, transparent 70%);
    top:-10%; left:-8%;
    opacity:0.55;
    animation:driftA 22s ease-in-out infinite alternate;
  }
  .orb--cyan{
    width:460px; height:460px;
    background:radial-gradient(circle, var(--cyan) 0%, transparent 70%);
    bottom:-15%; right:-8%;
    opacity:0.35;
    animation:driftB 26s ease-in-out infinite alternate;
  }
  .orb--small{
    width:260px; height:260px;
    background:radial-gradient(circle, var(--violet-soft) 0%, transparent 70%);
    top:55%; left:60%;
    opacity:0.3;
    animation:driftA 18s ease-in-out infinite alternate-reverse;
  }
  @keyframes driftA{ to{ transform:translate(40px,30px) scale(1.08);} }
  @keyframes driftB{ to{ transform:translate(-30px,-40px) scale(1.05);} }

  body::after{
    content:"";
    position:fixed; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:3px 3px;
    pointer-events:none;
    z-index:1;
  }

  @media (prefers-reduced-motion: reduce){
    .orb{ animation:none; }
  }

  /* ===== Glass panel ===== */
  .panel{
    position:relative;
    z-index:2;
    width:min(880px, 100%);
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:28px;
    backdrop-filter:blur(28px) saturate(140%);
    -webkit-backdrop-filter:blur(28px) saturate(140%);
    box-shadow:
      0 30px 90px -25px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.08);
    padding:44px 36px;
  }

  .counter-row{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:22px;
    flex-wrap:wrap;
    padding:10px 0 8px;
  }
  .unit-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .digit-pair{
    display:flex;
    gap:6px;
  }
  .unit-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .sep{
    align-self:center;
    font-family:'Syne', sans-serif;
    font-weight:700;
    font-size:clamp(22px,4vw,34px);
    color:var(--text-faint);
    margin-top:6px;
    user-select:none;
  }

  .flip{
    position:relative;
    width:clamp(46px, 8vw, 68px);
    height:clamp(62px, 11vw, 92px);
    perspective:300px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:clamp(28px, 5.2vw, 44px);
    color:var(--text);
  }
  .flip .card-face{
    position:absolute;
    left:0; right:0;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, var(--glass-strong), var(--glass));
    border:1px solid var(--glass-border);
    border-radius:12px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:
      0 12px 26px -10px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.10);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  .flip .card-front{
    transform:rotateX(0deg);
    z-index:2;
  }
  .flip .card-back{
    transform:rotateX(180deg);
    z-index:1;
  }
  .flip.flipping .card-front{
    animation:flipOut 0.55s cubic-bezier(.4,0,.2,1) forwards;
  }
  .flip.flipping .card-back{
    animation:flipIn 0.55s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes flipOut{
    0%{ transform:rotateX(0deg); }
    100%{ transform:rotateX(-180deg); }
  }
  @keyframes flipIn{
    0%{ transform:rotateX(180deg); }
    100%{ transform:rotateX(0deg); }
  }
  .flip .card-face::after{
    content:"";
    position:absolute;
    left:0; right:0; top:50%;
    height:1px;
    background:rgba(0,0,0,0.35);
  }

  .arrived{
    display:none;
    text-align:center;
    font-family:'Syne', sans-serif;
    font-weight:800;
    font-size:clamp(28px,5.5vw,44px);
    background:linear-gradient(90deg, var(--violet), var(--cyan));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    padding:24px 0;
  }

  @media (max-width:640px){
    .panel{ padding:34px 18px 24px; border-radius:22px; }
    .counter-row{ gap:14px; }
    .readout{ flex-direction:column; gap:10px; }
    .readout .progress-track{ width:100%; margin:0; }
  }
</style>
</head>
<body>

<div class="orb orb--violet"></div>
<div class="orb orb--cyan"></div>
<div class="orb orb--small"></div>

<div class="panel">

  <div class="counter-row" id="counterRow">
    <div class="unit-group">
      <div class="digit-pair" data-unit="days"></div>
      <div class="unit-label">Days</div>
    </div>
    <div class="sep">:</div>
    <div class="unit-group">
      <div class="digit-pair" data-unit="hours"></div>
      <div class="unit-label">Hrs</div>
    </div>
    <div class="sep">:</div>
    <div class="unit-group">
      <div class="digit-pair" data-unit="mins"></div>
      <div class="unit-label">Min</div>
    </div>
    <div class="sep">:</div>
    <div class="unit-group">
      <div class="digit-pair" data-unit="secs"></div>
      <div class="unit-label">Sec</div>
    </div>
  </div>

  <div class="arrived" id="arrivedMsg">ARRIVED</div>

</div>

<script>
  const TARGET = new Date("2027-10-16T00:00:00+05:30");
  const START  = new Date("2026-07-13T00:00:00+05:30");

  const pad = n => String(n).padStart(2,'0');

  const unitEls = {};
  document.querySelectorAll('.digit-pair').forEach(group => {
    const unit = group.dataset.unit;
    const digits = [];
    for(let i=0;i<2;i++){
      const flip = document.createElement('div');
      flip.className = 'flip';
      flip.innerHTML = `
        <div class="card-face card-front"><span class="front-val">0</span></div>
        <div class="card-face card-back"><span class="back-val">0</span></div>
      `;
      group.appendChild(flip);
      digits.push(flip);
    }
    unitEls[unit] = digits;
  });

  const lastVals = { days:null, hours:null, mins:null, secs:null };

  function setDigitPair(unit, valueStr){
    const [tens, ones] = valueStr.split('');
    const chars = [tens, ones];
    unitEls[unit].forEach((flipEl, i) => {
      const newChar = chars[i];
      const frontSpan = flipEl.querySelector('.front-val');
      const backSpan = flipEl.querySelector('.back-val');
      if(frontSpan.textContent === newChar) return;

      backSpan.textContent = newChar;
      flipEl.classList.add('flipping');

      setTimeout(() => {
        frontSpan.textContent = newChar;
        flipEl.classList.remove('flipping');
      }, 560);
    });
  }

  const counterRow = document.getElementById('counterRow');
  const arrivedMsg = document.getElementById('arrivedMsg');

  function tick(){
    const now = new Date();
    let diff = TARGET - now;

    if(diff <= 0){
      counterRow.style.display = 'none';
      arrivedMsg.style.display = 'block';
      diff = 0;
    } else {
      counterRow.style.display = 'flex';
      arrivedMsg.style.display = 'none';
    }

    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff / (1000*60*60)) % 24);
    const m = Math.floor((diff / (1000*60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    setDigitPair('days', pad(d));
    setDigitPair('hours', pad(h));
    setDigitPair('mins', pad(m));
    setDigitPair('secs', pad(s));
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
